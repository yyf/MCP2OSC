<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MCP2OSC · Three.js demo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
    #hud { position: absolute; left: 16px; top: 16px; z-index: 1; pointer-events: none; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="hud">
    <div>MCP2OSC · Three.js</div>
    <div id="status">connecting…</div>
    <div id="vals">slider: 0.500 · button: OFF · preset: 1</div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/osc-js@2.4.1/lib/osc.min.js"></script>
  <script type="module">
    import * as THREE from 'three';

    const PRESETS = {
      1: { slider: 0.25, button: 0 },
      2: { slider: 0.5, button: 1 },
      3: { slider: 1.0, button: 1 },
    };

    const state = { slider: 0.5, button: 0, preset: 1 };
    const statusEl = document.getElementById('status');
    const valsEl = document.getElementById('vals');

    function apply() {
      const s = state.slider;
      mesh.scale.setScalar(0.4 + s * 1.6);
      mesh.rotation.y = s * Math.PI * 2;
      mat.color.setHSL(0.55 - s * 0.35, 0.7, state.button ? 0.55 : 0.25);
      mat.emissive.setHex(state.button ? 0x224422 : 0x000000);
      valsEl.textContent =
        `slider: ${s.toFixed(3)} · button: ${state.button ? 'ON' : 'OFF'} · preset: ${state.preset}`;
    }

    // --- Three.js ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 0.6, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.45));
    const key = new THREE.DirectionalLight(0xffffff, 0.9);
    key.position.set(2, 3, 4);
    scene.add(key);

    const mat = new THREE.MeshStandardMaterial({ color: 0x88aacc, metalness: 0.2, roughness: 0.45 });
    const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(0.7, 1), mat);
    scene.add(mesh);
    apply();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function frame() {
      requestAnimationFrame(frame);
      mesh.rotation.x += 0.004;
      renderer.render(scene, camera);
    }
    frame();

    // --- OSC via bridge (UDP 9500 → WS 8081) ---
    const WS_PORT = 8081;
    const osc = new OSC();
    osc.open({ host: '127.0.0.1', port: WS_PORT });

    osc.on('open', () => {
      statusEl.textContent = `ws://127.0.0.1:${WS_PORT}`;
    });
    osc.on('close', () => {
      statusEl.textContent = 'disconnected — run npm run bridge';
    });
    osc.on('error', () => {
      statusEl.textContent = 'error — is osc-bridge.js running?';
    });

    osc.on('/mcp2osc/demo/slider', (msg) => {
      state.slider = Math.min(1, Math.max(0, Number(msg.args[0])));
      apply();
    });
    osc.on('/mcp2osc/demo/button', (msg) => {
      state.button = Number(msg.args[0]) !== 0 ? 1 : 0;
      apply();
    });
    osc.on('/mcp2osc/demo/preset', (msg) => {
      const n = Math.max(1, Math.min(3, Number(msg.args[0]) | 0));
      state.preset = n;
      state.slider = PRESETS[n].slider;
      state.button = PRESETS[n].button;
      apply();
    });
  </script>
</body>
</html>
